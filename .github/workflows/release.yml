name: Release

# Dispara ao publicar uma Release (com tag v*) pelo site do GitHub;
# os instaladores são anexados a essa Release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  instaladores:
    name: Instalador ${{ matrix.nome }}
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      # cada plataforma é independente: se uma falhar, as outras publicam
      fail-fast: false
      matrix:
        include:
          - nome: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            alvo: aarch64-apple-darwin
            triplo: aarch64-apple-darwin
          - nome: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            alvo: x86_64-apple-darwin
            triplo: x86_64-apple-darwin
          - nome: Windows
            os: windows-latest
            args: ""
            alvo: ""
            triplo: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.alvo }}
      # ffmpeg, ffprobe, raw2bmx e llama-server embutidos (app/binaries/<nome>-<alvo>, ver "externalBin" no tauri.conf.json).
      # Normalmente vêm do cache do workflow "Ferramentas embutidas"; se não, compila aqui (20 a 40 min).
      - name: Cache das ferramentas
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/binaries/*-${{ matrix.triplo }}*
            ferramentas-teste/mxf2raw-${{ matrix.triplo }}*
          key: ferramentas-${{ matrix.triplo }}-${{ hashFiles('scripts/compilar-ferramentas.sh') }}
      - name: Compilar ferramentas (Mac)
        if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
        run: brew install nasm pkg-config && scripts/compilar-ferramentas.sh ${{ matrix.triplo }} tudo
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib make diffutils tar xz curl
      - name: Compilar ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/compilar-ferramentas.sh ${{ matrix.triplo }} ffmpeg
      - name: Compilar raw2bmx (Windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/compilar-ferramentas.sh ${{ matrix.triplo }} bmx
      - name: Compilar llama-server (Windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/compilar-ferramentas.sh ${{ matrix.triplo }} llama
      # modelo da IA, que vai dentro do instalador (app/modelo/qwen.gguf, ver "resources" no tauri.conf.json)
      - name: Cache do modelo da IA
        uses: actions/cache@v4
        with:
          path: app/modelo/qwen.gguf
          key: modelo-${{ hashFiles('scripts/baixar-modelo.sh') }}
          enableCrossOsArchive: true
      - name: Modelo da IA
        shell: bash
        run: scripts/baixar-modelo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.release.tag_name }}
          releaseName: "SFX Finder ${{ github.event.release.tag_name }}"
          releaseDraft: false
          prerelease: false
      - name: Guardar instaladores como artefato (execução manual)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}-${{ matrix.alvo }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
