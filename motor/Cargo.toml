[package]
name = "motor"
description = "Motor do SFX Finder: índice, busca e conversão de efeitos sonoros (ffmpeg, ffprobe e raw2bmx)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
lofty = "0.25.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", default-features = false, features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
hound = "3.5"

[[bin]]
name = "motor-cli"
path = "src/bin/motor-cli.rs"
